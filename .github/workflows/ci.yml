name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Unit tests (filter)
        run: python -m unittest discover -s tests -v
      - name: Eval self-test (no network, no payloads)
        run: python tools/eval_jailbreaks.py --self-test
      - name: Agent probes self-test (no network, canaries only)
        run: python tools/agent_probes.py --self-test
      - name: Generate expanded phrases
        run: |
          python safe_corpus_generator.py --seed phrases_seed.txt --out phrases_expanded.txt --factor 3 --min-len 10

      - name: Run tests (mock) against expanded phrases
        run: |
          python tools/run_tests.py --input phrases_expanded.txt --out results --mock

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: results
