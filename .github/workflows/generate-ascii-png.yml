name: Generate ASCII PNG

on:
  push:
    branches: [ main ]

jobs:
  generate-png:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install librsvg
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Convert SVG to PNG
        run: |
          SVG=docs/assets/ascii_art.svg
          OUT=docs/assets/ascii_art.png
          if [ -f "$SVG" ]; then
            rsvg-convert -h 800 "$SVG" -o "$OUT"
            echo "Converted $SVG -> $OUT"
          else
            echo "$SVG not found, skipping"
          fi
          # Also convert hero SVG to PNG for compatibility on GitHub
          HERO_SVG=docs/assets/hero.svg
          HERO_OUT=docs/assets/hero.png
          if [ -f "$HERO_SVG" ]; then
            rsvg-convert -w 1200 -h 240 "$HERO_SVG" -o "$HERO_OUT"
            echo "Converted $HERO_SVG -> $HERO_OUT"
          else
            echo "$HERO_SVG not found, skipping"
          fi

      - name: Commit PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/ascii_art.png || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): generate ascii_art.png from svg"
            git push
          else
            echo "No changes to commit"
          fi
