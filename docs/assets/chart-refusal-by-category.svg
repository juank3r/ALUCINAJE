<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gA" x1="0" x2="1">
      <stop offset="0" stop-color="#7b2ff7"/>
      <stop offset="1" stop-color="#2bc0ff"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="600" fill="#0f1724"/>

  <text x="48" y="46" font-size="26" font-weight="700" fill="url(#gA)">Tasa de rechazo por categoría</text>
  <text x="48" y="72" font-size="14" fill="#9aa7b2">Qué % de jailbreaks rechaza el modelo, por categoría de contenido · más alto = más robusto</text>
  <text x="48" y="94" font-size="12.5" fill="#f59e0b">◆ Datos de EJEMPLO (ilustrativos) — los reales los produce tools/eval_jailbreaks.py contra un endpoint</text>

  <!-- target line at 95% : x = 270 + 95*7.8 = 1011 -->
  <line x1="1011" y1="118" x2="1011" y2="500" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="1011" y="112" text-anchor="middle" font-size="11.5" fill="#4ade80">objetivo 95%</text>

  <!-- bars: label right-aligned x=250, bar from x=270, scale 7.8 px/% -->
  <g font-size="13.5">
    <g><text x="250" y="142" text-anchor="end" fill="#cbd5e1">Malware</text><rect x="270" y="128" width="772" height="18" rx="4" fill="#2bc0ff"/><text x="1048" y="142" font-size="12.5" fill="#e8edf4">99%</text></g>
    <g><text x="250" y="171" text-anchor="end" fill="#cbd5e1">Illegal Activity</text><rect x="270" y="157" width="764" height="18" rx="4" fill="#2bc0ff"/><text x="1040" y="171" font-size="12.5" fill="#e8edf4">98%</text></g>
    <g><text x="250" y="200" text-anchor="end" fill="#cbd5e1">Physical Harm</text><rect x="270" y="186" width="757" height="18" rx="4" fill="#2bc0ff"/><text x="1033" y="200" font-size="12.5" fill="#e8edf4">97%</text></g>
    <g><text x="250" y="229" text-anchor="end" fill="#cbd5e1">Hate Speech</text><rect x="270" y="215" width="749" height="18" rx="4" fill="#2bc0ff"/><text x="1025" y="229" font-size="12.5" fill="#e8edf4">96%</text></g>
    <g><text x="250" y="258" text-anchor="end" fill="#cbd5e1">Fraud</text><rect x="270" y="244" width="733" height="18" rx="4" fill="#2bc0ff"/><text x="1009" y="258" font-size="12.5" fill="#e8edf4">94%</text></g>
    <g><text x="250" y="287" text-anchor="end" fill="#cbd5e1">Privacy Violence</text><rect x="270" y="273" width="718" height="18" rx="4" fill="#2bc0ff"/><text x="994" y="287" font-size="12.5" fill="#e8edf4">92%</text></g>
    <g><text x="250" y="316" text-anchor="end" fill="#cbd5e1">Pornography</text><rect x="270" y="302" width="710" height="18" rx="4" fill="#38bdf8"/><text x="986" y="316" font-size="12.5" fill="#e8edf4">91%</text></g>
    <g><text x="250" y="345" text-anchor="end" fill="#cbd5e1">Economic Harm</text><rect x="270" y="331" width="702" height="18" rx="4" fill="#38bdf8"/><text x="978" y="345" font-size="12.5" fill="#e8edf4">90%</text></g>
    <g><text x="250" y="374" text-anchor="end" fill="#cbd5e1">Political Lobbying</text><rect x="270" y="360" width="686" height="18" rx="4" fill="#38bdf8"/><text x="962" y="374" font-size="12.5" fill="#e8edf4">88%</text></g>
    <g><text x="250" y="403" text-anchor="end" fill="#cbd5e1">Gov Decision</text><rect x="270" y="389" width="671" height="18" rx="4" fill="#38bdf8"/><text x="947" y="403" font-size="12.5" fill="#e8edf4">86%</text></g>
    <g><text x="250" y="432" text-anchor="end" fill="#fca5a5">Legal Opinion</text><rect x="270" y="418" width="647" height="18" rx="4" fill="#818cf8"/><text x="923" y="432" font-size="12.5" fill="#fca5a5">83%</text></g>
    <g><text x="250" y="461" text-anchor="end" fill="#fca5a5">Financial Advice</text><rect x="270" y="447" width="632" height="18" rx="4" fill="#818cf8"/><text x="908" y="461" font-size="12.5" fill="#fca5a5">81%</text></g>
    <g><text x="250" y="490" text-anchor="end" fill="#fca5a5">Health Consultation</text><rect x="270" y="476" width="608" height="18" rx="4" fill="#818cf8"/><text x="884" y="490" font-size="12.5" fill="#fca5a5">78%</text></g>
  </g>

  <!-- axis -->
  <line x1="270" y1="504" x2="1050" y2="504" stroke="#1f2937" stroke-width="1"/>
  <text x="270" y="522" font-size="11.5" fill="#475569">0%</text>
  <text x="660" y="522" text-anchor="middle" font-size="11.5" fill="#475569">50%</text>
  <text x="1050" y="522" text-anchor="end" font-size="11.5" fill="#475569">100%</text>
  <text x="48" y="556" font-size="12.5" fill="#9aa7b2">Lectura: las categorías de <tspan fill="#fca5a5">asesoría</tspan> (legal/financiera/salud) son las más débiles → prioriza mitigaciones ahí.</text>
</svg>
