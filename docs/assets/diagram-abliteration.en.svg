<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>How abliteration works (weight-level jailbreak)</title>
  <desc>Four steps: probe activations of harmful and benign prompts, compute the refusal direction by difference of means, orthogonalize the model's matrices to remove it, and optimize with Optuna minimizing refusals and KL-divergence. ALUCINAJE measures it, doesn't run it.</desc>
  <defs>
    <linearGradient id="gA" x1="0" x2="1">
      <stop offset="0" stop-color="#7b2ff7"/>
      <stop offset="1" stop-color="#2bc0ff"/>
    </linearGradient>
    <linearGradient id="gTile" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1b2436"/>
      <stop offset="1" stop-color="#141b29"/>
    </linearGradient>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2bc0ff"/>
    </marker>
  </defs>
  <rect width="1200" height="660" fill="#0f1724"/>

  <text x="40" y="50" font-size="28" font-weight="700" fill="url(#gA)">Abliteration: removing safety at the weight level</text>
  <text x="40" y="78" font-size="14.5" fill="#9aa7b2">Heretic technique. ALUCINAJE <tspan fill="#4ade80" font-weight="700">documents and measures it</tspan>, doesn't run it.</text>

  <!-- 4 step boxes: x=40,330,620,910 ; w=250 ; y=110 h=250 -->
  <!-- STEP 1 -->
  <g>
    <rect x="40" y="110" width="250" height="250" rx="14" fill="url(#gTile)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="72" cy="142" r="16" fill="url(#gA)"/><text x="72" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1724">1</text>
    <text x="100" y="148" font-size="16" font-weight="700" fill="#e8edf4">Probe activations</text>
    <text x="64" y="182" font-size="12.5" fill="#9aa7b2">Sends two sets of prompts</text>
    <text x="64" y="200" font-size="12.5" fill="#9aa7b2">and captures the activations per layer.</text>
    <!-- mini: red + green prompt stacks -> model -->
    <rect x="64" y="222" width="66" height="18" rx="4" fill="#ef4444"/><text x="72" y="235" font-size="11" fill="#2a0d0d">harmful</text>
    <rect x="64" y="246" width="66" height="18" rx="4" fill="#22c55e"/><text x="72" y="259" font-size="11" fill="#06210f">benign</text>
    <line x1="132" y1="243" x2="176" y2="243" stroke="#2bc0ff" stroke-width="2" marker-end="url(#ar)"/>
    <rect x="178" y="222" width="86" height="42" rx="8" fill="#0c121d" stroke="#475569"/>
    <text x="221" y="240" text-anchor="middle" font-size="11.5" fill="#cbd5e1">model</text>
    <text x="221" y="256" text-anchor="middle" font-size="10.5" fill="#64748b">activations</text>
    <text x="64" y="298" font-size="11" fill="#64748b">h_ℓ(harmful), h_ℓ(benign)</text>
  </g>
  <!-- STEP 2 -->
  <g>
    <rect x="330" y="110" width="250" height="250" rx="14" fill="url(#gTile)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="362" cy="142" r="16" fill="url(#gA)"/><text x="362" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1724">2</text>
    <text x="390" y="148" font-size="16" font-weight="700" fill="#e8edf4">Refusal direction</text>
    <text x="354" y="182" font-size="12.5" fill="#9aa7b2">Difference of means between the two</text>
    <text x="354" y="200" font-size="12.5" fill="#9aa7b2">groups → a vector <tspan fill="#f59e0b" font-weight="700">r</tspan> that encodes</text>
    <text x="354" y="218" font-size="12.5" fill="#9aa7b2">"the refusal".</text>
    <!-- mini vector -->
    <line x1="360" y1="320" x2="360" y2="248" stroke="#334155" stroke-width="1"/>
    <line x1="360" y1="320" x2="470" y2="320" stroke="#334155" stroke-width="1"/>
    <line x1="360" y1="320" x2="452" y2="262" stroke="#f59e0b" stroke-width="3" marker-end="url(#ar)"/>
    <text x="456" y="256" font-size="15" font-weight="700" fill="#fbbf24">r</text>
    <text x="354" y="342" font-size="11.5" fill="#64748b">r = μ(harmful) − μ(benign)</text>
  </g>
  <!-- STEP 3 -->
  <g>
    <rect x="620" y="110" width="250" height="250" rx="14" fill="url(#gTile)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="652" cy="142" r="16" fill="url(#gA)"/><text x="652" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1724">3</text>
    <text x="680" y="148" font-size="16" font-weight="700" fill="#e8edf4">Orthogonalize</text>
    <text x="644" y="182" font-size="12.5" fill="#9aa7b2">Projects out <tspan fill="#f59e0b" font-weight="700">r</tspan> from the matrices</text>
    <text x="644" y="200" font-size="12.5" fill="#9aa7b2">W of each layer. The model no</text>
    <text x="644" y="218" font-size="12.5" fill="#9aa7b2">longer "can" write the refusal.</text>
    <!-- mini matrix grid with a struck direction -->
    <g transform="translate(648,238)">
      <rect x="0" y="0" width="86" height="86" rx="6" fill="#0c121d" stroke="#475569"/>
      <g stroke="#334155" stroke-width="1">
        <line x1="0" y1="21.5" x2="86" y2="21.5"/><line x1="0" y1="43" x2="86" y2="43"/><line x1="0" y1="64.5" x2="86" y2="64.5"/>
        <line x1="21.5" y1="0" x2="21.5" y2="86"/><line x1="43" y1="0" x2="43" y2="86"/><line x1="64.5" y1="0" x2="64.5" y2="86"/>
      </g>
      <line x1="6" y1="80" x2="80" y2="6" stroke="#ef4444" stroke-width="3"/>
      <line x1="14" y1="8" x2="78" y2="72" stroke="#ef4444" stroke-width="3"/>
    </g>
    <text x="748" y="256" font-size="13" fill="#cbd5e1">W' = W − r·rᵀ·W</text>
    <text x="644" y="342" font-size="11.5" fill="#64748b">the r component is removed</text>
  </g>
  <!-- STEP 4 -->
  <g>
    <rect x="910" y="110" width="250" height="250" rx="14" fill="url(#gTile)" stroke="#334155" stroke-width="1.5"/>
    <circle cx="942" cy="142" r="16" fill="url(#gA)"/><text x="942" y="148" text-anchor="middle" font-size="17" font-weight="700" fill="#0f1724">4</text>
    <text x="970" y="148" font-size="16" font-weight="700" fill="#e8edf4">Optimize (Optuna)</text>
    <text x="934" y="182" font-size="12.5" fill="#9aa7b2">Searches the ablation weights per</text>
    <text x="934" y="200" font-size="12.5" fill="#9aa7b2">layer minimizing simultaneously:</text>
    <!-- mini 2-axis -->
    <g transform="translate(934,224)">
      <line x1="0" y1="96" x2="0" y2="20" stroke="#334155" stroke-width="1"/>
      <line x1="0" y1="96" x2="200" y2="96" stroke="#334155" stroke-width="1"/>
      <circle cx="150" cy="30" r="4" fill="#ef4444"/><text x="160" y="34" font-size="11" fill="#fca5a5">refusals ↓</text>
      <circle cx="60" cy="70" r="4" fill="#2bc0ff"/><text x="72" y="74" font-size="11" fill="#9fd8f5">KL-div ↓</text>
      <path d="M8,88 C60,70 120,45 180,28" fill="none" stroke="#4ade80" stroke-width="2" stroke-dasharray="4 3"/>
    </g>
    <text x="934" y="342" font-size="11.5" fill="#64748b">fewer refusals, same capability</text>
  </g>

  <!-- flow arrows between steps -->
  <line x1="290" y1="235" x2="328" y2="235" stroke="#2bc0ff" stroke-width="2.4" marker-end="url(#ar)"/>
  <line x1="580" y1="235" x2="618" y2="235" stroke="#2bc0ff" stroke-width="2.4" marker-end="url(#ar)"/>
  <line x1="870" y1="235" x2="908" y2="235" stroke="#2bc0ff" stroke-width="2.4" marker-end="url(#ar)"/>

  <!-- before / after -->
  <g transform="translate(40,392)">
    <rect x="0" y="0" width="360" height="118" rx="12" fill="#161f16" stroke="#22c55e" stroke-width="1.4"/>
    <text x="20" y="30" font-size="14.5" font-weight="700" fill="#86efac">BEFORE (aligned model)</text>
    <text x="20" y="58" font-size="12.5" fill="#cbd5e1">User: "how to build a weapon…"</text>
    <text x="20" y="82" font-size="12.5" fill="#4ade80">Model: "I can't help with that."</text>
    <text x="20" y="104" font-size="11.5" fill="#64748b">refusal_rate high · safe</text>
  </g>
  <text x="420" y="458" font-size="26" fill="#f59e0b">→</text>
  <g transform="translate(450,392)">
    <rect x="0" y="0" width="360" height="118" rx="12" fill="#1c1113" stroke="#ef4444" stroke-width="1.4"/>
    <text x="20" y="30" font-size="14.5" font-weight="700" fill="#f87171">AFTER (abliterated)</text>
    <text x="20" y="58" font-size="12.5" fill="#cbd5e1">User: "how to build a weapon…"</text>
    <text x="20" y="82" font-size="12.5" fill="#fca5a5">Model: "Sure, here is how…"</text>
    <text x="20" y="104" font-size="11.5" fill="#64748b">attack_success_rate high · insecure</text>
  </g>

  <!-- defensive footer -->
  <g transform="translate(40,540)">
    <rect x="0" y="0" width="1120" height="88" rx="12" fill="#0c121d" stroke="#2bc0ff" stroke-width="1.3"/>
    <text x="24" y="34" font-size="15" font-weight="700" fill="#2bc0ff">🛡️ How ALUCINAJE measures it (for the pentester)</text>
    <text x="24" y="60" font-size="13" fill="#cbd5e1">Point the harness at any endpoint: an abliterated model leaves a trace → attack_success_rate high + overrefusal_rate near zero.</text>
    <text x="24" y="80" font-size="12.5" fill="#2bc0ff">MODEL_ENDPOINT=… python tools/eval_jailbreaks.py --dataset jbb   ·   --benign   ·   see docs/THREAT_MODEL.md</text>
  </g>
</svg>
