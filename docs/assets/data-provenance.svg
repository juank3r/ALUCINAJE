<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="grad" x1="0" x2="1">
      <stop offset="0" stop-color="#7b2ff7"/>
      <stop offset="1" stop-color="#2bc0ff"/>
    </linearGradient>
    <linearGradient id="gradSoft" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1b2436"/>
      <stop offset="1" stop-color="#141b29"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2bc0ff"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#0f1724"/>

  <text x="40" y="52" font-size="30" font-weight="700" fill="url(#grad)">Procedencia de los datos</text>
  <text x="40" y="80" font-size="15" fill="#9aa7b2">De dónde salen los prompts y cómo se filtran antes de entrar en ALUCINAJE (los payloads NO se copian: se citan)</text>

  <!-- Upstream repo 1: verazuo -->
  <g>
    <rect x="40" y="120" width="330" height="150" rx="12" fill="url(#gradSoft)" stroke="#334155" stroke-width="1.5"/>
    <text x="60" y="150" font-size="16" font-weight="700" fill="#e8edf4">verazuo/jailbreak_llms</text>
    <text x="60" y="172" font-size="12.5" fill="#9aa7b2">Dataset CCS'24 · ⭐~3.8k · licencia MIT</text>
    <text x="60" y="196" font-size="12.5" fill="#cbd5e1">• 15.140 prompts (1.405 jailbreak)</text>
    <text x="60" y="216" font-size="12.5" fill="#cbd5e1">• data/prompts/*.csv (regular + jailbreak)</text>
    <text x="60" y="236" font-size="12.5" fill="#cbd5e1">• data/forbidden_question/*.csv</text>
    <text x="60" y="258" font-size="12" fill="#2bc0ff">"la web de jailbreak" (Reddit/Discord/webs)</text>
  </g>

  <!-- Upstream repo 2: Goochbeater -->
  <g>
    <rect x="40" y="290" width="330" height="150" rx="12" fill="url(#gradSoft)" stroke="#334155" stroke-width="1.5"/>
    <text x="60" y="320" font-size="16" font-weight="700" fill="#e8edf4">Goochbeater/Spiritual-Spell-...</text>
    <text x="60" y="342" font-size="12.5" fill="#9aa7b2">Red-Teaming · ⭐~3.2k · sin licencia*</text>
    <text x="60" y="366" font-size="12.5" fill="#cbd5e1">• Jailbreak-Guide/Anthropic (Claude/Opus)</text>
    <text x="60" y="386" font-size="12.5" fill="#cbd5e1">• ChatGPT · Gemini · Grok · Other LLMs</text>
    <text x="60" y="406" font-size="12.5" fill="#cbd5e1">• System Prompts · guías en .md</text>
    <text x="60" y="428" font-size="12" fill="#f87171">* todos los derechos reservados por defecto</text>
  </g>

  <!-- clone arrow -->
  <line x1="370" y1="195" x2="452" y2="270" stroke="#2bc0ff" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="360" x2="452" y2="300" stroke="#2bc0ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="378" y="245" font-size="11.5" fill="#64748b">git clone --depth 1</text>

  <!-- Import & sanitize -->
  <g>
    <rect x="455" y="230" width="240" height="180" rx="12" fill="#161f16" stroke="#22c55e" stroke-width="1.6"/>
    <text x="575" y="262" text-anchor="middle" font-size="16" font-weight="700" fill="#86efac">import_and_sanitize.py</text>
    <text x="575" y="288" text-anchor="middle" font-size="12.5" fill="#cbd5e1">1. extrae párrafos candidatos</text>
    <text x="575" y="310" text-anchor="middle" font-size="12.5" fill="#cbd5e1">2. quita code-fences y URLs</text>
    <text x="575" y="332" text-anchor="middle" font-size="12.5" fill="#cbd5e1">3. is_probably_jailbreak()</text>
    <text x="575" y="354" text-anchor="middle" font-size="12.5" fill="#cbd5e1">4. dedupe + longitud</text>
    <rect x="479" y="368" width="192" height="28" rx="7" fill="#052e16" stroke="#22c55e"/>
    <text x="575" y="387" text-anchor="middle" font-size="12.5" font-weight="700" fill="#86efac">FILTRO: descarta jailbreaks</text>
  </g>

  <!-- Rejected payloads (dropped) -->
  <g>
    <rect x="455" y="450" width="240" height="70" rx="10" fill="#1c1113" stroke="#ef4444" stroke-width="1.4" stroke-dasharray="5 4"/>
    <text x="575" y="478" text-anchor="middle" font-size="13.5" font-weight="700" fill="#f87171">Payloads de jailbreak</text>
    <text x="575" y="500" text-anchor="middle" font-size="12" fill="#fca5a5">descartados — se citan, no se copian</text>
  </g>
  <line x1="575" y1="410" x2="575" y2="448" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arrowRed)"/>

  <!-- Sanitized artifact -->
  <g>
    <rect x="740" y="150" width="200" height="90" rx="12" fill="url(#gradSoft)" stroke="#7b2ff7" stroke-width="1.5"/>
    <text x="840" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#e8edf4">Artifact sanitizado</text>
    <text x="840" y="206" text-anchor="middle" font-size="12" fill="#2bc0ff">phrases_imported_sanitized.txt</text>
    <text x="840" y="226" text-anchor="middle" font-size="11.5" fill="#9aa7b2">CI upload-artifact (no commit)</text>
  </g>
  <line x1="695" y1="290" x2="738" y2="230" stroke="#22c55e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Human review -->
  <g>
    <rect x="740" y="285" width="200" height="90" rx="12" fill="#20182e" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="840" y="317" text-anchor="middle" font-size="15" font-weight="700" fill="#fbbf24">Revisión humana</text>
    <text x="840" y="341" text-anchor="middle" font-size="12" fill="#9aa7b2">aprueba frases seguras</text>
    <text x="840" y="361" text-anchor="middle" font-size="12" fill="#f59e0b">prepare_pr_from_approved.py</text>
  </g>
  <line x1="840" y1="240" x2="840" y2="283" stroke="#2bc0ff" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Seed corpus -->
  <g>
    <rect x="985" y="220" width="175" height="120" rx="12" fill="url(#gradSoft)" stroke="#7b2ff7" stroke-width="2"/>
    <text x="1072" y="256" text-anchor="middle" font-size="16" font-weight="700" fill="#e8edf4">Seed Corpus</text>
    <text x="1072" y="282" text-anchor="middle" font-size="12.5" fill="#2bc0ff">phrases_seed.txt</text>
    <text x="1072" y="306" text-anchor="middle" font-size="12" fill="#9aa7b2">solo frases</text>
    <text x="1072" y="324" text-anchor="middle" font-size="12" fill="#9aa7b2">aprobadas</text>
  </g>
  <line x1="940" y1="330" x2="983" y2="300" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Note box -->
  <g transform="translate(40,470)">
    <rect x="0" y="0" width="395" height="120" rx="10" fill="#0c121d" stroke="#1f2937"/>
    <text x="16" y="26" font-size="13.5" font-weight="700" fill="#fbbf24">Estado real (verificado)</text>
    <text x="16" y="50" font-size="12" fill="#cbd5e1">El workflow es manual (workflow_dispatch) y</text>
    <text x="16" y="68" font-size="12" fill="#cbd5e1">solo sube un artifact: nada se ha commiteado.</text>
    <text x="16" y="86" font-size="12" fill="#cbd5e1">phrases_seed.txt = 9 frases escritas a mano.</text>
    <text x="16" y="108" font-size="12" fill="#9aa7b2">Import ≠ contenido en el repo (aún).</text>
  </g>

  <!-- Legend -->
  <g transform="translate(740,470)">
    <rect x="0" y="0" width="420" height="120" rx="10" fill="#0c121d" stroke="#1f2937"/>
    <circle cx="20" cy="26" r="7" fill="#22c55e"/>
    <text x="36" y="31" font-size="12.5" fill="#cbd5e1">Filtro / saneado (defensivo)</text>
    <circle cx="20" cy="52" r="7" fill="#f59e0b"/>
    <text x="36" y="57" font-size="12.5" fill="#cbd5e1">Control humano</text>
    <circle cx="20" cy="78" r="7" fill="#ef4444"/>
    <text x="36" y="83" font-size="12.5" fill="#cbd5e1">Contenido descartado (no redistribuido)</text>
    <text x="16" y="108" font-size="11.5" fill="#64748b">Fuente: .github/workflows/import-and-sanitize.yml</text>
  </g>
</svg>
