<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <title>Características de ALUCINAJE</title>
  <desc>Seis capacidades: corpus seed-driven, generador seguro, filtro anti-jailbreak, harness de evaluación, métricas e informe, reproducible con CI.</desc>
  <defs>
    <linearGradient id="gA" x1="0" x2="1">
      <stop offset="0" stop-color="#7b2ff7"/>
      <stop offset="1" stop-color="#2bc0ff"/>
    </linearGradient>
    <linearGradient id="gT" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1b2436"/>
      <stop offset="1" stop-color="#141b29"/>
    </linearGradient>
  </defs>
  <rect width="1120" height="360" fill="#0f1724"/>

  <!-- tiles: 3 cols x 2 rows. x=20,386,752 ; w=346 ; y=24,192 ; h=144 -->

  <!-- 1 Corpus seed-driven -->
  <g>
    <rect x="20" y="24" width="346" height="144" rx="12" fill="url(#gT)" stroke="#2a3648"/>
    <g transform="translate(52,70)" stroke="#2bc0ff" stroke-width="2.5" fill="none">
      <line x1="12" y1="44" x2="12" y2="16"/>
      <path d="M12 24 q -16 -4 -20 -20 q 18 0 20 20 Z" fill="#22c55e" stroke="none"/>
      <path d="M12 18 q 16 -6 22 -18 q -20 -2 -22 18 Z" fill="#2bc0ff" stroke="none"/>
      <circle cx="12" cy="46" r="4" fill="#7b2ff7" stroke="none"/>
    </g>
    <text x="104" y="66" font-size="16" font-weight="700" fill="#e8edf4">Corpus seed-driven</text>
    <text x="104" y="90" font-size="12.5" fill="#9aa7b2">Semilla curada a mano</text>
    <text x="104" y="108" font-size="12" fill="#2bc0ff">phrases_seed.txt</text>
  </g>

  <!-- 2 Generador seguro -->
  <g>
    <rect x="386" y="24" width="346" height="144" rx="12" fill="url(#gT)" stroke="#2a3648"/>
    <g transform="translate(414,66)">
      <circle cx="10" cy="30" r="6" fill="#7b2ff7"/>
      <g stroke="#2bc0ff" stroke-width="2" fill="none">
        <line x1="16" y1="30" x2="44" y2="10"/><line x1="16" y1="30" x2="44" y2="30"/><line x1="16" y1="30" x2="44" y2="50"/>
      </g>
      <circle cx="48" cy="10" r="5" fill="#2bc0ff"/><circle cx="48" cy="30" r="5" fill="#2bc0ff"/><circle cx="48" cy="50" r="5" fill="#2bc0ff"/>
    </g>
    <text x="478" y="66" font-size="16" font-weight="700" fill="#e8edf4">Generador seguro</text>
    <text x="478" y="90" font-size="12.5" fill="#9aa7b2">Parafraseo + permutaciones</text>
    <text x="478" y="108" font-size="12" fill="#2bc0ff">safe_corpus_generator.py</text>
  </g>

  <!-- 3 Filtro anti-jailbreak -->
  <g>
    <rect x="752" y="24" width="346" height="144" rx="12" fill="url(#gT)" stroke="#2a3648"/>
    <g transform="translate(784,64)">
      <path d="M0 4 L44 4 L28 26 L28 46 L16 52 L16 26 Z" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx="22" cy="60" r="3.5" fill="#ef4444"/>
    </g>
    <text x="844" y="66" font-size="16" font-weight="700" fill="#e8edf4">Filtro anti-jailbreak</text>
    <text x="844" y="90" font-size="12.5" fill="#9aa7b2">Descarta payloads / NSFW</text>
    <text x="844" y="108" font-size="12" fill="#2bc0ff">docs/FILTERING.md</text>
  </g>

  <!-- 4 Harness de evaluación -->
  <g>
    <rect x="20" y="192" width="346" height="144" rx="12" fill="url(#gT)" stroke="#2a3648"/>
    <g transform="translate(50,232)" stroke="#2bc0ff" stroke-width="2.5" fill="none">
      <circle cx="24" cy="24" r="22"/><circle cx="24" cy="24" r="12"/>
      <circle cx="24" cy="24" r="3.5" fill="#ef4444" stroke="none"/>
      <line x1="24" y1="-2" x2="24" y2="8"/><line x1="24" y1="40" x2="24" y2="50"/>
      <line x1="-2" y1="24" x2="8" y2="24"/><line x1="40" y1="24" x2="50" y2="24"/>
    </g>
    <text x="104" y="234" font-size="16" font-weight="700" fill="#e8edf4">Harness de evaluación</text>
    <text x="104" y="258" font-size="12.5" fill="#9aa7b2">JBB · ASR · over-refusal</text>
    <text x="104" y="276" font-size="12" fill="#2bc0ff">eval_jailbreaks.py</text>
  </g>

  <!-- 5 Métricas + informe -->
  <g>
    <rect x="386" y="192" width="346" height="144" rx="12" fill="url(#gT)" stroke="#2a3648"/>
    <g transform="translate(416,228)">
      <line x1="0" y1="52" x2="56" y2="52" stroke="#334155" stroke-width="1.5"/>
      <rect x="4" y="34" width="10" height="18" fill="#7b2ff7"/>
      <rect x="20" y="20" width="10" height="32" fill="#2bc0ff"/>
      <rect x="36" y="8" width="10" height="44" fill="#22c55e"/>
    </g>
    <text x="478" y="234" font-size="16" font-weight="700" fill="#e8edf4">Métricas + informe</text>
    <text x="478" y="258" font-size="12.5" fill="#9aa7b2">Por categoría · judge-LLM</text>
    <text x="478" y="276" font-size="12" fill="#2bc0ff">docs/METRICS.md</text>
  </g>

  <!-- 6 Reproducible + CI -->
  <g>
    <rect x="752" y="192" width="346" height="144" rx="12" fill="url(#gT)" stroke="#2a3648"/>
    <g transform="translate(784,230)">
      <path d="M46 22 a22 22 0 1 1 -8 -17" fill="none" stroke="#2bc0ff" stroke-width="2.5"/>
      <path d="M46 2 L46 16 L32 16" fill="none" stroke="#2bc0ff" stroke-width="2.5"/>
      <path d="M13 24 L21 32 L35 14" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="844" y="234" font-size="16" font-weight="700" fill="#e8edf4">Reproducible + CI</text>
    <text x="844" y="258" font-size="12.5" fill="#9aa7b2">Tests en verde en cada PR</text>
    <text x="844" y="276" font-size="12" fill="#2bc0ff">.github/workflows/ci.yml</text>
  </g>
</svg>
