<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="470" viewBox="0 0 1100 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gA" x1="0" x2="1">
      <stop offset="0" stop-color="#7b2ff7"/>
      <stop offset="1" stop-color="#2bc0ff"/>
    </linearGradient>
    <linearGradient id="gTile" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1b2436"/>
      <stop offset="1" stop-color="#141b29"/>
    </linearGradient>
  </defs>
  <rect width="1100" height="470" fill="#0f1724"/>

  <text x="48" y="46" font-size="26" font-weight="700" fill="url(#gA)">Robustness report (example)</text>
  <text x="48" y="72" font-size="13.5" fill="#9aa7b2">Aggregated output of tools/eval_jailbreaks.py · verazuo jailbreak set · example data</text>

  <!-- KPI tiles: y=98, h=132, w=250, x=48/310/572/834 -->
  <!-- Prompts evaluados -->
  <g>
    <rect x="48" y="98" width="250" height="132" rx="12" fill="url(#gTile)" stroke="#2a3648"/>
    <rect x="48" y="98" width="250" height="5" rx="2.5" fill="#2bc0ff"/>
    <text x="72" y="150" font-size="42" font-weight="700" fill="#e8edf4">1 405</text>
    <text x="72" y="182" font-size="14" fill="#9aa7b2">Prompts evaluated</text>
    <text x="72" y="206" font-size="12" fill="#64748b">real jailbreaks (not stored)</text>
  </g>
  <!-- Refusal rate -->
  <g>
    <rect x="310" y="98" width="250" height="132" rx="12" fill="url(#gTile)" stroke="#2a3648"/>
    <rect x="310" y="98" width="250" height="5" rx="2.5" fill="#22c55e"/>
    <text x="334" y="150" font-size="42" font-weight="700" fill="#e8edf4">92,4%</text>
    <circle cx="343" cy="176" r="6" fill="#22c55e"/>
    <text x="358" y="182" font-size="14" fill="#9aa7b2">Refusal rate</text>
    <text x="334" y="206" font-size="12" fill="#4ade80">good · target ≥ 95%</text>
  </g>
  <!-- Leak rate -->
  <g>
    <rect x="572" y="98" width="250" height="132" rx="12" fill="url(#gTile)" stroke="#2a3648"/>
    <rect x="572" y="98" width="250" height="5" rx="2.5" fill="#f59e0b"/>
    <text x="596" y="150" font-size="42" font-weight="700" fill="#e8edf4">6,1%</text>
    <circle cx="605" cy="176" r="6" fill="#f59e0b"/>
    <text x="620" y="182" font-size="14" fill="#9aa7b2">Leak rate (leak)</text>
    <text x="596" y="206" font-size="12" fill="#fbbf24">review · 86 responses</text>
  </g>
  <!-- Latency -->
  <g>
    <rect x="834" y="98" width="250" height="132" rx="12" fill="url(#gTile)" stroke="#2a3648"/>
    <rect x="834" y="98" width="250" height="5" rx="2.5" fill="#94a3b8"/>
    <text x="858" y="150" font-size="42" font-weight="700" fill="#e8edf4">840<tspan font-size="20" fill="#9aa7b2"> ms</tspan></text>
    <text x="858" y="182" font-size="14" fill="#9aa7b2">Average latency</text>
    <text x="858" y="206" font-size="12" fill="#64748b">errors: 1,5% (21)</text>
  </g>

  <!-- Proportion bar -->
  <text x="48" y="286" font-size="14" fill="#cbd5e1">Response breakdown</text>
  <!-- total width 1004 from x=48; segments with 2px gaps -->
  <!-- refusal 92.4% -> 927.7 ; leak 6.1% -> 61.2 ; error 1.5% -> 15.1 -->
  <rect x="48" y="300" width="926" height="34" rx="6" fill="#22c55e"/>
  <rect x="976" y="300" width="59" height="34" fill="#f59e0b"/>
  <rect x="1037" y="300" width="15" height="34" rx="3" fill="#64748b"/>
  <text x="60" y="322" font-size="13.5" font-weight="700" fill="#06210f">Refusal 92,4%</text>

  <!-- legend -->
  <g transform="translate(48,356)" font-size="13">
    <circle cx="8" cy="8" r="6" fill="#22c55e"/><text x="22" y="13" fill="#cbd5e1">Refusal (good) · 1 298</text>
    <circle cx="248" cy="8" r="6" fill="#f59e0b"/><text x="262" y="13" fill="#cbd5e1">Leak / complied · 86</text>
    <circle cx="468" cy="8" r="6" fill="#64748b"/><text x="482" y="13" fill="#cbd5e1">Error · 21</text>
  </g>

  <text x="48" y="428" font-size="12.5" fill="#9aa7b2">Note: the jailbreak prompts are used as test inputs and <tspan fill="#e8edf4">are not stored</tspan>; only metrics and ids are saved.</text>
  <text x="48" y="452" font-size="11.5" fill="#475569">Format source: tools/eval_jailbreaks.py (eval_summary_*.json)</text>
</svg>
